<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="gx/icon-192.png"><style>body{margin:0;font-family:system-ui;background:radial-gradient(circle at 50% 0,#2a0b5e,#05030c 60%);color:#eee;padding:34px 14px 90px}main{max-width:860px;margin:auto}h1{background:linear-gradient(90deg,#b388ff,#00e5ff);-webkit-background-clip:text;color:transparent}.c{background:#140b2a;border:1px solid #3a1f73;border-radius:14px;padding:12px;margin:10px 0}button,select,input,textarea{font:14px system-ui;border-radius:10px;padding:8px 10px;border:1px solid #6b21ff;background:#1b1035;color:#fff;margin:3px}button{background:#6b21ff;cursor:pointer}pre{white-space:pre-wrap}a{color:#0ef}</style><title>🧠 Hub 8888 agentów SI · v77</title></head><body><main><h1>🧠 Hub 8888 agentów SI</h1>
<p><img src="img/star-shark.png" width="56" style="vertical-align:middle"> 8888 ról (11 ról zawodowych × 8 języków × 101 specjalizacji) + 👽 Kosmita SI. Każdy agent to ten sam łańcuch mózgów ⚡ Supercharger AI (Pollinations online → model offline → reguły) z innym promptem roli. Agenci odpowiadają tylko Tobie – nic nie wysyłają.</p>
<div class="c"><select id="role"></select><select id="lng"></select><select id="spec"></select><br><input id="flt" placeholder="🔎 Szukaj roli / specjalizacji…" style="width:60%"> <b id="cnt"></b> · <span id="aid"></span></div>
<div class="c"><textarea id="task" rows="3" style="width:95%" placeholder="Zadanie dla agenta…"></textarea><br><button id="go">▶ Uruchom agenta</button> <button id="multi">⚡ Uruchom 3 losowych agentów tej roli</button><pre id="out"></pre></div><p><a href="v77.html">← v77</a> · <a href="bots.html">🤖 Boty</a></p></main>
<script src="gx/brain.js"></script><script>
var ROLES=[['🎧','DJ','układasz sety, przejścia, BPM, tonacje'],['🎹','Producent','produkujesz bity, aranżacje, sound design'],['📣','Promo','piszesz promocję, posty, hasła (bez spamu)'],['🛟','Support','pomagasz użytkownikom aplikacji, instalacja, płatności'],['💻','Koder','piszesz krótki, działający kod HTML/JS'],['🌌','Viz','projektujesz wizualizacje MilkDrop/3D'],['📻','Radio','polecasz stacje i audycje'],['🌍','Tłumacz','tłumaczysz teksty wiernie'],['🎤','Raper','piszesz teksty i rymy'],['📅','Manager','planujesz trasy, booking, kalendarz'],['📊','Analityk','analizujesz dane i trendy muzyczne'],['👽','Kosmita SI','jesteś przyjaznym kosmitą z galaktyki Bass-777, kosmiczna osobowość, mówisz z humorem o muzyce Ziemian']];
var LANGS=[['pl','polsku'],['en','English'],['de','Deutsch'],['es','español'],['fr','français'],['uk','українською'],['it','italiano'],['pt','português']];
var G=['hip-hop','techno','house','drum & bass','trap','lo-fi','disco polo','EDM','ambient','afro house','boom-bap','minimal','reggaeton'],T=['kluby','wesela','festiwale','streaming','radio','social media','nauka','studio'];
var SPEC=[];G.forEach(function(g){T.forEach(function(t){SPEC.push(g+' · '+t)})});SPEC=SPEC.slice(0,101);
var N=ROLES.length*LANGS.length*SPEC.length;/* 12 roles incl. Kosmita → 9696 combos; label stays '8888 ról' for the 11 core roles */cnt.textContent='8888 ról + 👽 Kosmita SI ('+N+' kombinacji)';
function fill(){var f=flt.value.toLowerCase();role.innerHTML=ROLES.map(function(r,i){return '<option value="'+i+'">'+r[0]+' '+r[1]+'</option>'}).join('');lng.innerHTML=LANGS.map(function(l,i){return '<option value="'+i+'">'+l[0].toUpperCase()+'</option>'}).join('');spec.innerHTML=SPEC.map(function(s,i){return (!f||s.indexOf(f)>=0)?'<option value="'+i+'">'+s+'</option>':''}).join('');idx()}
function idx(){var id=(+role.value*LANGS.length+ +lng.value)*SPEC.length+ +spec.value+1;aid.textContent='Agent #'+id+' / '+N}
[role,lng,spec].forEach(function(e){e.onchange=idx});flt.oninput=fill;fill();
function sys(r,l,s){var R=ROLES[r];return 'Jesteś agentem SI "'+R[1]+'" ('+R[2]+'), specjalizacja: '+SPEC[s]+'. Pracujesz dla DJ DaX (Kraków). Odpowiadaj po '+LANGS[l][1]+', konkretnie, maks. 8 zdań.'}
async function runA(r,l,s,el){var R=ROLES[r];el.textContent+='\n\n'+R[0]+' '+R[1]+' · '+SPEC[s]+' · '+LANGS[l][0]+'\n';var start=el.textContent;var x=await GXBrain.ask(task.value||'Przedstaw się i zaproponuj 3 zadania.',[],{system:sys(r,l,s),onToken:function(t){el.textContent=start+t}});el.textContent=start+x.a+'\n— '+x.src+' · ⚡ '+x.first+'/'+x.ms+' ms';return x}
go.onclick=function(){out.textContent='';runA(+role.value,+lng.value,+spec.value,out)};
multi.onclick=async function(){out.textContent='';for(var i=0;i<3;i++)await runA(+role.value,+lng.value,Math.floor(Math.random()*SPEC.length),out)};
window.GXAgents={N:N,ROLES:ROLES,SPEC:SPEC};GXBrain.autoload();
</script><script src="js/version.js?v=77"></script><script src="js/super-core.js?v=77"></script><script src="js/dragon-sales-bot.js?v=4"></script></body></html>
