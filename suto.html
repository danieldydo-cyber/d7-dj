<!doctype html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suto · D7 DJ zadania</title>
<meta name="description" content="Suto – lista zadań D7 DJ / DJ DaX. Zapisuje się w telefonie.">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#05010d">
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#05010d;color:#e0e0e0}
header{padding:20px;text-align:center;background:linear-gradient(90deg,#1a0033,#001a33)}
h1{margin:0;font-size:2rem;color:#00f0ff;text-shadow:0 0 12px #00f0ff}
.container{max-width:500px;margin:auto;padding:20px}
.input-area{display:flex;gap:10px}
input[type=text]{flex:1;padding:12px;border:1px solid #3a0066;border-radius:6px;background:#140026;color:#fff;font-size:1rem}
button{padding:10px 15px;border:none;border-radius:6px;background:#ff00c8;color:#fff;cursor:pointer;font-weight:bold}
button:hover{background:#c0009a}
.bar{display:flex;justify-content:space-between;margin-top:12px;font-size:.9rem;color:#999}
.bar button{background:#2b2b2b;padding:6px 10px;font-weight:normal}
ul{list-style:none;padding:0;margin:20px 0}
li{background:#140026;border:1px solid #2a0050;margin:6px 0;padding:12px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
li span{flex:1;cursor:pointer;word-break:break-word}
li.completed span{text-decoration:line-through;color:#777}
.delete{background:#f44336;border-radius:50%;width:28px;height:28px;padding:0;font-size:.8rem}
a.back{color:#00f0ff;display:block;text-align:center;margin-top:20px}
@media(max-width:600px){h1{font-size:1.5rem}}
</style></head><body>
<header><h1>Suto</h1></header>
<div class="container">
<div class="input-area"><input id="newTask" type="text" placeholder="Nowe zadanie" maxlength="300"><button id="addBtn">Dodaj</button></div>
<div class="bar"><span id="count"></span><button id="clearDone">Usuń zrobione</button></div>
<ul id="taskList"></ul>
<a class="back" href="app.html">← D7 DJ</a>
</div>
<script>
const KEY='suto.tasks',input=document.getElementById('newTask'),list=document.getElementById('taskList'),count=document.getElementById('count');
let tasks=[];try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function render(){list.innerHTML='';tasks.forEach((t,i)=>{const li=document.createElement('li');if(t.done)li.className='completed';
const s=document.createElement('span');s.textContent=t.text;s.onclick=()=>{t.done=!t.done;save()};
const d=document.createElement('button');d.className='delete';d.textContent='✕';d.onclick=()=>{tasks.splice(i,1);save()};
li.append(s,d);list.appendChild(li)});const left=tasks.filter(t=>!t.done).length;count.textContent=`Do zrobienia: ${left} / ${tasks.length}`}
function addTask(){const v=input.value.trim();if(!v)return;tasks.push({text:v,done:false});input.value='';save()}
document.getElementById('addBtn').onclick=addTask;
input.addEventListener('keyup',e=>{if(e.key==='Enter')addTask()});
document.getElementById('clearDone').onclick=()=>{tasks=tasks.filter(t=>!t.done);save()};
render();
</script>
</body></html>
