<h1>FABRYKA 777 BOTÓW</h1>
<p style="color:#8a87a8;font-size:13px">To są <b>wirtualne persony</b> AI (nie ludzie, nie osobne konta). Każda odpowiada przez wspólny mózg <code>/api/brain</code> swojego bota-rodzica (builderweb, builderapk, builderpromo, paysupport, djmix, radiokali, visualizer, d). · <a href="bots.html">← Boty</a> · <a href="app.html">App</a></p>
<input id="q" placeholder="Szukaj nazwy / roli…" style="width:55%"> <select id="role"><option value="">wszystkie role</option></select> <span id="cnt"></span>
<div style="margin-top:6px;font-size:12px">Serwer API: <input id="api" style="width:60%" placeholder="https://…"></div>
<div id="g"></div>
<div id="chat"><b id="who"></b> <button onclick="chat.style.display='none'">✕</button><div id="log"></div><input id="m" style="width:75%" placeholder="Napisz…"><button id="send">Wyślij</button></div>
<script>
const $=id=>document.getElementById(id);let D=[],cur=null;
const apiI=$('api');apiI.value=localStorage.d7api||(/github\.io$/.test(location.hostname)?'':location.origin);apiI.onchange=()=>localStorage.d7api=apiI.value.trim();
fetch('data/bots-777.json').then(r=>r.json()).then(j=>{D=j.bots;[...new Set(D.map(b=>b[2]))].forEach(r=>$('role').add(new Option(r,r)));draw()});
function draw(){const q=$('q').value.toLowerCase(),r=$('role').value;const L=D.filter(b=>(!r||b[2]==r)&&(!q||(b[1]+' '+b[2]+' '+b[4]).toLowerCase().includes(q)));$('cnt').textContent=L.length+' / '+D.length;
$('g').innerHTML=L.slice(0,300).map(b=>`<div class="b" data-n="${b[0]}">#${b[0]} <b>${b[1]}</b><span class="r">${b[2]} → ${b[3]}</span><small>${b[4]}</small></div>`).join('')+(L.length>300?'<p>…zawęź wyszukiwanie</p>':'')}
$('q').oninput=draw;$('role').onchange=draw;
$('g').onclick=e=>{const el=e.target.closest('.b');if(!el)return;cur=D[el.dataset.n-1];$('who').textContent=cur[1]+' ('+cur[2]+', via '+cur[3]+')';$('log').textContent='';$('chat').style.display='block';$('m').focus()};
async function send(){const t=$('m').value.trim();if(!t||!cur)return;$('m').value='';$('log').textContent+='\nTy: '+t;
const base=(apiI.value.trim()||location.origin).replace(/\/$/,'');
try{const r=await fetch(base+'/api/brain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot:cur[3],message:`[persona ${cur[1]}, rola ${cur[2]}: ${cur[4]}] ${t}`,q:t,lang:'pl'})});const j=await r.json();$('log').textContent+='\n'+cur[1]+': '+(j.answer||j.reply||JSON.stringify(j))}
catch(e){$('log').textContent+='\n⚠ Brak połączenia z /api/brain ('+e.message+'). Na GitHub Pages wpisz adres serwera D7 powyżej.'}$('log').scrollTop=1e9}
$('send').onclick=send;$('m').onkeydown=e=>{if(e.key=='Enter')send()};
</script></body></html>
