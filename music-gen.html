<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="gx/icon-192.png"><style>body{margin:0;font-family:system-ui;background:radial-gradient(circle at 50% 0,#2a0b5e,#05030c 60%);color:#eee;padding:34px 14px 90px}main{max-width:860px;margin:auto}h1{background:linear-gradient(90deg,#b388ff,#00e5ff);-webkit-background-clip:text;color:transparent}.c{background:#140b2a;border:1px solid #3a1f73;border-radius:14px;padding:12px;margin:10px 0}button,select,input,textarea{font:14px system-ui;border-radius:10px;padding:8px 10px;border:1px solid #6b21ff;background:#1b1035;color:#fff;margin:3px}button{background:#6b21ff;cursor:pointer}pre{white-space:pre-wrap}a{color:#0ef}</style><title>🎹 Generator muzyki · v77</title></head><body><main><h1>🎹 Generator muzyki</h1><p>Proceduralne bity i melodie (WebAudio, offline). Render do WAV → odtwarzanie w prawdziwym &lt;audio&gt; (gra też przy wygaszonym ekranie) i eksport.</p>
<div class="c">Styl <select id="sty"><option value="techno">Techno</option><option value="hiphop">Hip-hop (boom-bap)</option><option value="house">House</option><option value="trap">Trap</option></select>
BPM <input id="bpm" type="number" value="128" min="60" max="180" style="width:70px"> Tonacja <select id="key"></select> <select id="sc"><option value="minor">moll</option><option value="major">dur</option></select>
Takty <select id="bars"><option>4</option><option selected>8</option><option>16</option></select> Seed <input id="seed" type="number" value="777" style="width:80px"><br>
<button id="gen">🎲 Generuj</button> <button id="rnd">🔀 Losuj seed</button> <a id="dl" style="display:none"><button>💾 Pobierz WAV</button></a> <span id="st"></span></div>
<div class="c"><audio id="au" controls loop style="width:100%"></audio><canvas id="cv" width="800" height="90" style="width:100%;height:90px"></canvas></div>
<p><a href="radio-gen.html">📻 Radio + generator techno (7D)</a> · <a href="v77.html">← v77</a></p></main>
<script>
var KEYS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];key.innerHTML=KEYS.map(function(k,i){return '<option value="'+i+'"'+(i==9?' selected':'')+'>'+k+'</option>'}).join('');
sty.onchange=function(){bpm.value={techno:128,hiphop:90,house:124,trap:140}[sty.value]};rnd.onclick=function(){seed.value=Math.floor(Math.random()*99999);gen.onclick()};
function rng(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function wav(buf){var n=buf.length,ch=2,b=new ArrayBuffer(44+n*4),v=new DataView(b),w=function(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*4,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,buf.sampleRate,true);v.setUint32(28,buf.sampleRate*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*4,true);
 var L=buf.getChannelData(0),R=buf.getChannelData(1),o=44;for(var i=0;i<n;i++){v.setInt16(o,Math.max(-1,Math.min(1,L[i]))*32767,true);v.setInt16(o+2,Math.max(-1,Math.min(1,R[i]))*32767,true);o+=4}return new Blob([b],{type:'audio/wav'})}
window.GXMusic={render:async function(o){var BPM=+o.bpm,beat=60/BPM,bars=+o.bars,len=bars*4*beat,sr=44100,ctx=new OfflineAudioContext(2,Math.ceil(len*sr),sr),r=rng(+o.seed),st=o.style;
 var master=ctx.createDynamicsCompressor();master.connect(ctx.destination);var mg=ctx.createGain();mg.gain.value=0.8;mg.connect(master);
 var noiseB=ctx.createBuffer(1,sr,sr),nd=noiseB.getChannelData(0);for(var i=0;i<sr;i++)nd[i]=Math.random()*2-1;
 function kick(t){var os=ctx.createOscillator(),g=ctx.createGain();os.frequency.setValueAtTime(150,t);os.frequency.exponentialRampToValueAtTime(40,t+0.12);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);os.connect(g);g.connect(mg);os.start(t);os.stop(t+0.4)}
 function noise(t,d,f,vol){var s=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noiseB;fl.type='highpass';fl.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(fl);fl.connect(g);g.connect(mg);s.start(t);s.stop(t+d+0.02)}
 var root=+o.key,scale=o.scale==='major'?[0,2,4,5,7,9,11]:[0,2,3,5,7,8,10],hz=function(n){return 440*Math.pow(2,(n-69)/12)};
 function synth(t,n,d,type,vol,cut){var os=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();os.type=type;os.frequency.value=hz(n);f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);os.connect(f);f.connect(g);g.connect(mg);os.start(t);os.stop(t+d+0.05)}
 var bassPat=[],melPat=[];for(var i=0;i<16;i++){bassPat.push(r()<(st==='techno'?0.5:0.35)?scale[Math.floor(r()*3)]:null);melPat.push(r()<0.3?scale[Math.floor(r()*7)]+12*Math.floor(r()*2):null)}
 var swing=st==='hiphop'?0.06:0,steps=bars*16,sx=beat/4;
 for(var s=0;s<steps;s++){var t=s*sx+(s%2?swing*beat:0),p=s%16;
  if(st==='techno'||st==='house'){if(p%4===0)kick(t);if(p%4===2)noise(t,0.05,7000,0.25);if(st==='house'&&(p===4||p===12))noise(t,0.18,1500,0.45);if(st==='techno'&&p%2===1)noise(t,0.03,9000,0.12)}
  else if(st==='hiphop'){if(p===0||p===10||(p===7&&r()<0.5))kick(t);if(p===4||p===12)noise(t,0.2,1200,0.6);if(p%2===0)noise(t,0.04,8000,0.18)}
  else{if(p===0||p===7||p===11)kick(t);if(p===8)noise(t,0.22,1500,0.6);noise(t,0.025,9000,p%4===0?0.2:0.1)}
  if(bassPat[p]!=null)synth(t,36+root+bassPat[p],sx*1.8,st==='trap'?'sine':'sawtooth',0.35,st==='techno'?400+300*Math.sin(s/8):600);
  if(melPat[p]!=null&&s>=16)synth(t,60+root+melPat[p],sx*2.5,st==='hiphop'?'triangle':'square',0.12,2500)}
 return ctx.startRendering()},wav:wav};
gen.onclick=async function(){st.textContent='⏳ render…';var t0=performance.now();var b=await GXMusic.render({style:sty.value,bpm:bpm.value,key:key.value,scale:sc.value,bars:bars.value,seed:seed.value});var bl=wav(b),u=URL.createObjectURL(bl);au.src=u;dl.href=u;dl.download='C-Mass-G-Unit-'+sty.value+'-'+bpm.value+'bpm-'+KEYS[key.value]+'-'+seed.value+'.wav';dl.style.display='';
 st.textContent='✅ '+b.duration.toFixed(1)+' s · '+Math.round(bl.size/1024)+' KB · '+Math.round(performance.now()-t0)+' ms';var d=b.getChannelData(0),x=cv.getContext('2d');x.clearRect(0,0,800,90);x.fillStyle='#00e5ff';for(var i=0;i<800;i++){var m=0;for(var j=0;j<50;j++)m=Math.max(m,Math.abs(d[Math.floor(i*d.length/800)+j]||0));x.fillRect(i,45-m*44,1,m*88)}
 if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:sty.value+' '+bpm.value+' BPM '+KEYS[key.value],artist:'C Mass G Unit v77'});window.GXMusic.last={dur:b.duration,size:bl.size}};
</script><script src="js/gx-bg.js?v=77"></script><script src="js/version.js?v=77"></script><script src="js/super-core.js?v=77"></script><script src="js/dragon-sales-bot.js?v=4"></script></body></html>
