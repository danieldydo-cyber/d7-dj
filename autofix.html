<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="gx/icon-192.png"><style>body{margin:0;font-family:system-ui;background:radial-gradient(circle at 50% 0,#2a0b5e,#05030c 60%);color:#eee;padding:34px 14px 90px}main{max-width:860px;margin:auto}h1{background:linear-gradient(90deg,#b388ff,#00e5ff);-webkit-background-clip:text;color:transparent}.c{background:#140b2a;border:1px solid #3a1f73;border-radius:14px;padding:12px;margin:10px 0}button,select,input,textarea{font:14px system-ui;border-radius:10px;padding:8px 10px;border:1px solid #6b21ff;background:#1b1035;color:#fff;margin:3px}button{background:#6b21ff;cursor:pointer}pre{white-space:pre-wrap}a{color:#0ef}</style><title>🛠 Super Core Auto-Fix · v77</title></head><body><main><h1>🛠 Super Core Auto-Fix</h1><p>Samodiagnostyka v77: strony, pliki, service worker, cache, wersje na mirrorach. Naprawia: usuwa uszkodzone wpisy cache, ponawia moduły, przełącza na mirror.</p>
<button id="run">▶ Sprawdź teraz</button> <button id="clr">🧹 Wyczyść cache aplikacji (bez modelu AI)</button> <button id="upd">🔄 Wymuś aktualizację SW</button><div class="c"><pre id="o">⏳</pre></div><p><a href="v77.html">← v77</a></p></main>
<script src="js/super-core.js?v=77"></script><script>
function show(r){o.textContent='Stan: '+GXCore.state+'\nCzas: '+r.at+'\nWersja lokalna: v'+r.local.version+' ('+(r.local.name||'')+')\nOnline: '+r.online+'\nService worker: '+r.sw+'\nNaprawione wpisy cache: '+r.fixedCache+'\n\nMirrory:\n'+r.remote.map(function(m){return (m.ok?'🟢 ':'🔴 ')+m.m+(m.ok?' v'+m.v:'')}).join('\n')+'\n\nPliki:\n'+r.assets.map(function(a){return (a.ok?'🟢 ':'🔴 ')+a.st+' '+a.ms+' ms '+a.u.split('/').slice(-2).join('/')}).join('\n')+(r.update?'\n\n🔄 Dostępna nowsza wersja – przeładuj.':'')+(r.mirror?'\n\n➡️ Ten host nie działa – użyj: '+r.mirror:'')+(GXCore.log.length?'\n\nLog: '+GXCore.log.join(', '):'')}
run.onclick=function(){o.textContent='⏳';GXCore.run().then(show)};setTimeout(function(){GXCore.run().then(show)},300);
clr.onclick=async function(){var n=0;for(var k of await caches.keys()){if(!/webllm|transformers/.test(k)){await caches.delete(k);n++}}o.textContent='🧹 Usunięto '+n+' cache. Model AI zachowany.'};
upd.onclick=async function(){var r=await navigator.serviceWorker.getRegistrations();r.forEach(function(x){x.update()});o.textContent='🔄 Sprawdzono aktualizacje SW ('+r.length+').'};
</script></body></html>
