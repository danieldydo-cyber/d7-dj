<style>html,body{margin:0;height:100%;background:#000;color:#eee;font-family:system-ui;overflow:hidden}#mv{position:fixed;inset:0;width:100vw;height:100vh}#bc{display:none}
#ui{position:fixed;left:8px;right:8px;bottom:8px;z-index:5;background:#0c0620d9;border:1px solid #6b21ff;border-radius:14px;padding:8px;font-size:13px;max-height:46vh;overflow:auto}#ui.min .x{display:none}
button,select,input{font:13px system-ui;border-radius:9px;border:1px solid #6b21ff;background:#1b1035;color:#fff;padding:6px 8px;margin:2px}button{background:#6b21ff}label{margin-right:8px;white-space:nowrap}#info{color:#ffd23f;font-weight:700}</style></head><body>
<canvas id="mv"></canvas><canvas id="bc" width="640" height="360"></canvas>
<div id="ui"><b>🌀 Mix Visuals 778</b> <span id="info"></span> <button id="hide">▾</button>

<br><label><input type="checkbox" id="lMd" checked> MilkDrop</label><label><input type="checkbox" id="l3d" checked> 3D tunel</label><label><input type="checkbox" id="lPa" checked> cząsteczki</label><label><input type="checkbox" id="lFr" checked> fraktal</label><label><input type="checkbox" id="lSh" checked> 🦈 rekin</label><label><input type="checkbox" id="lAl" checked> 👽 kosmita</label>

<script src="libs/butterchurn.min.js"></script><script src="libs/butterchurnPresets.min.js"></script><script src="libs/butterchurnPresetsExtra.min.js"></script><script src="js/cosmic-layer.js?v=77"></script>
<script>
var $=function(i){return document.getElementById(i)},mv=$('mv'),x=mv.getContext('2d'),bc=$('bc'),ac=null,viz=null,P={},names=[],combo=null,favL=JSON.parse(localStorage.getItem('gx_mixfav')||'[]');
GXCosmic.toggle(false);
function rng(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function audio(){if(!ac){ac=new AudioContext();window.GXMixAC=ac;ac.__dest=ac.createMediaStreamDestination()}if(ac.state!=='running')ac.resume();return ac}
function initMD(){if(viz||!window.butterchurn)return;try{var a=audio(),B=butterchurn.default||butterchurn;viz=B.createVisualizer(a,bc,{width:640,height:360,pixelRatio:1});var ps=[window.butterchurnPresets,window.butterchurnPresetsExtra];ps.forEach(function(m){if(!m)return;var o=(m.getPresets?m.getPresets():(m.default&&m.default.getPresets?m.default.getPresets():{}));Object.assign(P,o)});names=Object.keys(P);if(a.__src)viz.connectAudio(a.__src)}catch(e){console.warn('md',e)}}
function src(node){var a=audio();a.__src=node;if(viz)viz.connectAudio(node);try{node.connect(a.__dest)}catch(e){}}
$('demo').onclick=function(){var a=audio(),g=a.createGain();g.gain.value=0.5;g.connect(a.destination);var bpm=128,t0=a.currentTime+0.1;window.GXFakeBpm=bpm;
 for(var i=0;i<512;i++){var t=t0+i*60/bpm,o=a.createOscillator(),k=a.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);k.gain.setValueAtTime(1,t);k.gain.exponentialRampToValueAtTime(0.001,t+0.3);o.connect(k);k.connect(g);o.start(t);o.stop(t+0.32);
  if(i%2){var b=a.createOscillator(),bk=a.createGain();b.type='sawtooth';b.frequency.value=[55,55,65.4,49][i%4];bk.gain.setValueAtTime(0.25,t+0.23);bk.gain.exponentialRampToValueAtTime(0.001,t+0.45);b.connect(bk);bk.connect(g);b.start(t+0.23);b.stop(t+0.5)}}
 src(g);initMD();$('info').textContent='🥁 demo 128 BPM'};
$('mic').onclick=async function(){try{var s=await navigator.mediaDevices.getUserMedia({audio:true}),a=audio(),n=a.createMediaStreamSource(s),an=a.createAnalyser();an.fftSize=512;n.connect(an);GXAudio.extra=[an];src(n);initMD();$('info').textContent='🎤 mikrofon'}catch(e){$('info').textContent='🎤 brak dostępu'}};
$('inapp').onclick=function(){var a=audio(),el=new Audio();el.crossOrigin='anonymous';el.src='https://stream.radiokaliveronika.pl/stream';el.play().then(function(){try{var n=a.createMediaElementSource(el);n.connect(a.destination);src(n);initMD();$('info').textContent='📻 radio'}catch(e){$('info').textContent='📻 radio (bez analizy – CORS)'}}).catch(function(){$('info').textContent='📻 radio niedostępne – użyj 🥁 lub 🎤'})};
function newCombo(seed){var r=rng(seed);combo={seed:seed,preset:names.length?names[Math.floor(r()*names.length)]:'',gens:['tun','par','fra'].filter(function(){return r()<0.6}),hue:Math.floor(r()*360),twist:r()*2+0.5,shape:Math.floor(r()*3)};if(!combo.gens.length)combo.gens=['par'];
 if(viz&&combo.preset)try{viz.loadPreset(P[combo.preset],2.7)}catch(e){};$('info').textContent='#'+seed+' · '+(combo.preset?combo.preset.slice(0,40)+' · ':'')+combo.gens.join('+');window.GXMix={combo:combo,count:(window.GXMix?GXMix.count:0)+1,frames:window.GXMix?GXMix.frames:0}}
$('next').onclick=function(){$('seed').value=Math.floor(Math.random()*999999);newCombo(+$('seed').value)};$('seed').onchange=function(){newCombo(+$('seed').value)};
var lastSw=performance.now();
function renderFavs(){$('favs').innerHTML='<option value="">⭐ Ulubione ('+favL.length+')…</option>'+favL.map(function(f,i){return '<option value="'+i+'">#'+f.seed+' '+(f.preset||'').slice(0,24)+'</option>'}).join('')}renderFavs();
$('fav').onclick=function(){favL.unshift({seed:combo.seed,preset:combo.preset,spd:$('spd').value,hue:$('hue').value,int:$('int').value});favL=favL.slice(0,50);localStorage.setItem('gx_mixfav',JSON.stringify(favL));renderFavs()};
$('favs').onchange=function(){var f=favL[this.value];if(!f)return;$('seed').value=f.seed;$('spd').value=f.spd;$('hue').value=f.hue;$('int').value=f.int;newCombo(+f.seed)};
$('hide').onclick=function(){$('ui').classList.toggle('min')};$('fs').onclick=function(){(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(function(){})};
var rec=null,chunks=[];$('rec').onclick=function(){if(rec){rec.stop();return}var st=mv.captureStream(30);if(ac&&ac.__dest)ac.__dest.stream.getAudioTracks().forEach(function(t){st.addTrack(t)});var mt=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].filter(function(m){return window.MediaRecorder&&MediaRecorder.isTypeSupported(m)})[0];if(!mt){$('info').textContent='Brak MediaRecorder WebM';return}
 rec=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:4e6});chunks=[];rec.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};rec.onstop=function(){var b=new Blob(chunks,{type:'video/webm'});$('dl').href=URL.createObjectURL(b);$('dl').download='MixVisuals778-'+combo.seed+'.webm';$('dl').style.display='';$('dl').textContent='💾 Pobierz nagranie ('+Math.round(b.size/1024)+' KB)';window.GXMix.recSize=b.size;rec=null;$('rec').textContent='⏺ Nagraj WebM'};rec.start(500);$('rec').textContent='⏹ Stop'};
var parts=[];for(var i=0;i<220;i++)parts.push({a:Math.random()*7,r:Math.random(),s:Math.random()*0.5+0.5});
function frame(t){var w=mv.width=innerWidth*Math.min(devicePixelRatio,1.5),h=mv.height=innerHeight*Math.min(devicePixelRatio,1.5),A=GXAudio.level(),sp=+$('spd').value,k=+$('int').value,hu=(+$('hue').value+combo.hue)%360,L=A.level;
 if($('auto').checked&&performance.now()-lastSw>+$('per').value*1000){lastSw=performance.now();$('seed').value=(+$('seed').value*7+778)%999999;newCombo(+$('seed').value)}
 x.fillStyle='#000';x.fillRect(0,0,w,h);
 if($('lMd').checked&&viz){try{viz.render();x.globalAlpha=1;x.drawImage(bc,0,0,w,h)}catch(e){}}else{x.fillStyle='hsl('+hu+',60%,'+(6+L*10)+'%)';x.fillRect(0,0,w,h)}
 x.globalCompositeOperation='lighter';var cx=w/2,cy=h/2,T=t*0.001*sp;
 if($('l3d').checked&&combo.gens.indexOf('tun')>=0||$('l3d').checked&&!viz){for(var i=0;i<18;i++){var z=((i/18+T*0.25)%1),rr=Math.pow(z,2)*Math.max(w,h)*(0.9+L*0.4*k);x.strokeStyle='hsla('+((hu+i*14)%360)+',100%,60%,'+(0.15+0.5*z)*k+')';x.lineWidth=2+6*z;x.beginPath();if(combo.shape===0)x.arc(cx+Math.sin(T+i)*20*k,cy,rr,0,7);else{var n=combo.shape===1?4:6;for(var j=0;j<=n;j++){var an=j/n*Math.PI*2+T*combo.twist*0.3*(i%2?1:-1);x.lineTo(cx+Math.cos(an)*rr,cy+Math.sin(an)*rr)}}x.stroke()}}
 if($('lPa').checked&&combo.gens.indexOf('par')>=0){parts.forEach(function(p,i){p.r+=0.004*sp*p.s*(1+L*3*k);if(p.r>1.2)p.r=0.02;var rr=p.r*Math.max(w,h)*0.7,a=p.a+T*0.2*combo.twist;x.fillStyle='hsla('+((hu+i)%360)+',100%,65%,'+(0.7*k)+')';x.beginPath();x.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,(1+p.r*5)*(1+L*2),0,7);x.fill()})}
 if($('lFr').checked&&combo.gens.indexOf('fra')>=0){x.save();x.translate(cx,cy);(function br(len,d){if(d>7)return;x.strokeStyle='hsla('+((hu+d*30)%360)+',100%,60%,'+(0.5*k)+')';x.lineWidth=Math.max(1,7-d);for(var j=0;j<3;j++){x.save();x.rotate(j*2.094+T*0.3*combo.twist+(d*0.2*Math.sin(T)));x.beginPath();x.moveTo(0,0);x.lineTo(0,-len);x.stroke();x.translate(0,-len);x.scale(0.62,0.62);if(d<5)br(len,d+1);x.restore()}})(Math.min(w,h)*0.18*(1+L*0.5*k),0);x.restore()}
 x.globalCompositeOperation='source-over';GXCosmic.draw(x,w,h,t,A,{speed:sp,intensity:k,shark:$('lSh').checked,alien:$('lAl').checked});
 if(A.beat){x.fillStyle='rgba(255,255,255,'+0.06*k+')';x.fillRect(0,0,w,h)}window.GXMix.frames++;requestAnimationFrame(frame)}
newCombo(778);requestAnimationFrame(frame);try{initMD();newCombo(778)}catch(e){}
</script><script src="js/version.js?v=77"></script><script src="js/super-core.js?v=77"></script></body></html>
